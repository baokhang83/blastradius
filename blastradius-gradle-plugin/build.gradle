plugins {
    id 'java-gradle-plugin'
    id 'com.gradle.plugin-publish' version '2.2.1'
    id 'com.gradleup.shadow' version '9.6.1'
}

description = 'Selects JVM tests affected by Java and Kotlin changes using observed per-test dependencies.'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

gradlePlugin {
    website = 'https://github.com/baokhang83/blastradius'
    vcsUrl = 'https://github.com/baokhang83/blastradius.git'
    plugins {
        blastradius {
            id = 'io.github.baokhang83.blastradius'
            implementationClass = 'io.github.baokhang83.blastradius.gradle.BlastradiusPlugin'
            displayName = 'Blastradius test impact analysis'
            description = project.description
            tags.set(['test-impact-analysis', 'test-selection', 'junit5', 'maven', 'jvm'])
        }
    }
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes(
                'Premain-Class': 'io.github.baokhang83.blastradius.core.tracking.DependencyTrackingAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('jar') {
    archiveClassifier = 'thin'
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('test') {
    dependsOn tasks.named('shadowJar')
}

dependencies {
    implementation project(path: ':blastradius-core', configuration: 'agentElements')
    implementation project(':blastradius-s3-index-store')
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.9.0.202403050737-r'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'org.junit.platform:junit-platform-launcher:1.10.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
