name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    name: Maven 3.9.6 / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6
      - name: Restore Blastradius index
        id: blastradius-index
        uses: actions/cache/restore@v6
        with:
          path: |
            .blastradius
            **/.blastradius
            !**/target/**/.blastradius
          key: blastradius-index-v2-${{ runner.os }}-jdk${{ matrix.java }}-${{ github.sha }}
          restore-keys: |
            blastradius-index-v2-${{ runner.os }}-jdk${{ matrix.java }}-
      - name: Bootstrap Blastradius plugin
        run: |
          RELEASE_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          SELF_HOST_VERSION="${RELEASE_VERSION}-selfhost"
          export SELF_HOST_VERSION
          mvn -B --no-transfer-progress -DskipTests -Dinvoker.skip=true -pl blastradius-maven-plugin -am package
          mkdir -p target/self-host/META-INF/maven
          cp "blastradius-maven-plugin/target/blastradius-maven-plugin-${RELEASE_VERSION}.jar" "target/blastradius-maven-plugin-${SELF_HOST_VERSION}.jar"
          unzip -p "blastradius-maven-plugin/target/blastradius-maven-plugin-${RELEASE_VERSION}.jar" META-INF/maven/plugin.xml \
            | perl -0pe 's{(<artifactId>blastradius-maven-plugin</artifactId>\s*<version>)[^<]+(</version>)}{$1 . $ENV{SELF_HOST_VERSION} . $2}e' \
            > target/self-host/META-INF/maven/plugin.xml
          (cd target/self-host && jar uf "../blastradius-maven-plugin-${SELF_HOST_VERSION}.jar" META-INF/maven/plugin.xml)
          mvn -B --no-transfer-progress org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file \
            -Dfile="target/blastradius-maven-plugin-${SELF_HOST_VERSION}.jar" \
            -DgroupId=io.github.baokhang83.blastradius \
            -DartifactId=blastradius-maven-plugin \
            -Dversion="${SELF_HOST_VERSION}" \
            -Dpackaging=maven-plugin \
            -DgeneratePom=true
      - name: Verify with Blastradius
        env:
          # A restore-key hit contains an older baseline. It is safe for a PR to select
          # from that baseline, but main must rebuild before saving this commit's cache key.
          BLASTRADIUS_REFRESH_MAIN_INDEX: ${{ github.ref == 'refs/heads/main' && steps.blastradius-index.outputs.cache-hit != 'true' }}
        run: |
          blastradius_mode=()
          if [[ "$BLASTRADIUS_REFRESH_MAIN_INDEX" == "true" ]]; then
            blastradius_mode+=("-Dblastradius.mode=track")
          fi
          mvn -B --no-transfer-progress "${blastradius_mode[@]}" -Pself-host-blastradius clean verify
      - name: Generate JaCoCo badge
        if: matrix.java == '21'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: coverage/target/site/jacoco-aggregate/jacoco.csv
          badges-directory: coverage/target/site/jacoco-aggregate/badges
      - name: Publish coverage report to GitHub Pages
        if: matrix.java == '21' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: coverage/target/site/jacoco-aggregate
      - name: Save Blastradius index from main
        if: ${{ github.ref == 'refs/heads/main' && success() && steps.blastradius-index.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .blastradius
            **/.blastradius
            !**/target/**/.blastradius
          key: blastradius-index-v2-${{ runner.os }}-jdk${{ matrix.java }}-${{ github.sha }}
      - name: Publish Blastradius selection feedback
        if: ${{ always() }}
        uses: ./.github/actions/blastradius-selection-summary
        with:
          report-paths: |
            blastradius-core/.blastradius/last-build-report.json
            blastradius-s3-index-store/.blastradius/last-build-report.json
            blastradius-validator/.blastradius/last-build-report.json
            blastradius-maven-plugin/.blastradius/last-build-report.json
          comment: false
          github-token: ${{ github.token }}
      - name: Upload Blastradius selection reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: blastradius-selection-report-jdk${{ matrix.java }}
          path: |
            blastradius-core/.blastradius/last-build-report.json
            blastradius-s3-index-store/.blastradius/last-build-report.json
            blastradius-validator/.blastradius/last-build-report.json
            blastradius-maven-plugin/.blastradius/last-build-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

  selection-feedback:
    name: Publish Blastradius selection feedback
    needs: verify
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Blastradius selection reports
        uses: actions/download-artifact@v7
        with:
          pattern: blastradius-selection-report-jdk*
          path: selection-reports
      - name: Publish one selection comment for all JDKs
        uses: actions/github-script@v9
        env:
          REPORT_ROOT: selection-reports
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const {
              COMMENT_MARKER,
              combineSelectionReports,
              renderMatrixSelectionSummary,
            } = require(path.join(process.env.GITHUB_WORKSPACE, '.github/actions/blastradius-selection-summary/render-summary.cjs'));
            const requiredReportPaths = [
              'blastradius-core/.blastradius/last-build-report.json',
              'blastradius-s3-index-store/.blastradius/last-build-report.json',
              'blastradius-validator/.blastradius/last-build-report.json',
              'blastradius-maven-plugin/.blastradius/last-build-report.json',
            ];
            const reportRoot = path.join(process.env.GITHUB_WORKSPACE, process.env.REPORT_ROOT);
            const reports = [];

            if (fs.existsSync(reportRoot)) {
              for (const entry of fs.readdirSync(reportRoot, { withFileTypes: true })) {
                const match = /^blastradius-selection-report-jdk(\d+)$/.exec(entry.name);
                if (!entry.isDirectory() || !match) continue;

                const artifactRoot = path.join(reportRoot, entry.name);
                const missingPaths = requiredReportPaths.filter((reportPath) => !fs.existsSync(path.join(artifactRoot, reportPath)));
                if (missingPaths.length > 0) {
                  core.warning(`JDK ${match[1]} did not produce all selection reports.`);
                  continue;
                }

                try {
                  const moduleReports = requiredReportPaths.map((reportPath) => JSON.parse(fs.readFileSync(path.join(artifactRoot, reportPath), 'utf8')));
                  reports.push({ jdk: match[1], report: combineSelectionReports(moduleReports) });
                } catch (error) {
                  core.warning(`Could not read the JDK ${match[1]} selection reports: ${error.message}`);
                }
              }
            }

            const body = reports.length > 0
              ? renderMatrixSelectionSummary(reports)
              : `${COMMENT_MARKER}\n## Blastradius selection\n\nNo selection report was produced by this build.\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const priorComment = comments.find((comment) => comment.user.type === 'Bot' && comment.body?.includes(COMMENT_MARKER));

            if (priorComment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: priorComment.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
